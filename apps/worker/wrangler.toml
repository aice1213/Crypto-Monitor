name = "crypto-monitor-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

account_id = "d95b04d0dcf147b40c75dd809e7cfd1d"

[vars]
GATEIO_BASE = "https://api.gateio.ws"
AI_PROVIDER = "workers-ai"
AI_ENABLED = "true"
AI_DAILY_LIMIT = "500"
# CORS 白名单：留空表示允许所有来源
ALLOWED_ORIGINS = ""

[[kv_namespaces]]
binding = "CRYPTO_CACHE"
id = "78f38a660d6b477dab99fd9299883398"

[ai]
binding = "AI"

[triggers]
crons = []
