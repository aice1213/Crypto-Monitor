name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 显式构建依赖包：shared / indicators 的 `main` 指向 ./dist，
      # 而 dist 被 .gitignore 忽略、仓库中不存在。此前 CI 依赖
      # "Typecheck" 步骤（未加 --noEmit）的副作用产出 dist，顺序一改就会断。
      - name: Build packages
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/indicators

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build --workspace=apps/web

  deploy:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared + indicators
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/indicators

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web
        working-directory: apps/web
        run: npx vite build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: crypto-monitor
          directory: apps/web/dist
